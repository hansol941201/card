name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 시공사 지도 분포 팝업: 카카오맵 JavaScript 키는 저장소에 절대 커밋하지 않는다
      # (kakaoMapConfig.js는 .gitignore 대상). 대신 이 빌드 단계에서만 GitHub Secrets의
      # KAKAO_MAP_JS_KEY 값으로 kakaoMapConfig.js를 생성해 배포 아티팩트에만 포함시킨다.
      # §카카오 키 배포 진단 라운드: 이전엔 시크릿이 비어 있어도 조용히 키 없이
      # 배포됐는데, 그러면 "왜 안 되는지" 배포 로그만 봐서는 알기 어려웠다 — 이제는
      # 시크릿이 비어 있으면 배포 자체를 실패시키고 ::error::로 원인을 명확히 남긴다.
      # (인덱스 페이지 쪽은 여전히 키 없이도 정상 동작 — 이건 "배포 파이프라인이
      # 문제를 숨기지 않는다"는 것이지 "키 없인 CRM이 안 돌아간다"는 뜻이 아니다.)
      # 로그에 키 값 자체가 남지 않도록 echo로 값을 직접 출력하지 않는다.
      - name: Generate kakaoMapConfig.js from secret (배포 아티팩트 전용, 저장소에는 커밋 안 됨)
        env:
          KAKAO_MAP_JS_KEY: ${{ secrets.KAKAO_MAP_JS_KEY }}
        run: |
          if [ -z "$KAKAO_MAP_JS_KEY" ]; then
            echo "::error::KAKAO_MAP_JS_KEY 저장소 시크릿이 비어 있거나 이 워크플로에 전달되지 않았습니다."
            echo "::error::Settings → Secrets and variables → Actions → Repository secrets 에서"
            echo "::error::이름이 정확히 KAKAO_MAP_JS_KEY 인지, 이 저장소(hansol941201/card)에 등록됐는지 확인해주세요."
            exit 1
          fi
          node -e "
            const key = JSON.stringify(process.env.KAKAO_MAP_JS_KEY);
            const fs = require('fs');
            fs.writeFileSync('kakaoMapConfig.js',
              'window.SHIN2_KAKAO_MAP_CONFIG = {\n  javascriptKey: ' + key + '\n};\n');
          "
          # 키 값 자체는 절대 출력하지 않는다 — 파일이 생성됐다는 사실과, 그 안의
          # 전역 변수명이 index.html이 실제로 읽는 이름과 일치하는지 구조만 확인한다.
          test -f kakaoMapConfig.js && echo "kakaoMapConfig.js generated: OK (파일 존재 확인, 키 값은 출력 안 함)"
          if grep -q "window.SHIN2_KAKAO_MAP_CONFIG" kakaoMapConfig.js && grep -q "javascriptKey" kakaoMapConfig.js; then
            echo "kakaoMapConfig.js format check: OK (window.SHIN2_KAKAO_MAP_CONFIG.javascriptKey 존재)"
          else
            echo "::error::kakaoMapConfig.js 형식이 index.html이 기대하는 전역 변수명과 다릅니다."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
